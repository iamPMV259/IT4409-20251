<!DOCTYPE html>
<html>
<head>
    <title>React App</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        
        function SearchForm({ onChangeValue }) {
            return (
                <div>
                    <input
                        type="text"
                        placeholder="Tìm theo name, username"
                        onChange={(e) => onChangeValue(e.target.value)}
                        style={{ padding: '8px', fontSize: '16px', width: '300px' }}
                    />
                </div>
            );
        }

        function AddUser({ onAdd }) {
            const [adding, setAdding] = React.useState(false);
            const [user, setUser] = React.useState({
                name: "",
                username: "",
                email: "",
                address: { street: "", suite: "", city: ""},
                phone: "",
                website: "",
            }
            );
            const handleChange = (e) => {
                const { id, value} = e.target;
                if (["street", "suite", "city"].includes(id)) {
                    setUser({
                        ...user,
                        address: {
                            ...user.address,
                            [id]: value
                        }
                    });
                } else {
                    setUser({
                        ...user,
                        [id]: value
                    });
                }
            }

            const handleAdd = () => {
                if (user.name === "" || user.username === "") {
                    alert("Vui lòng nhập Name và Username!");
                    return;
                }
                onAdd(user);
                setUser({
                    name: "",
                    username: "",
                    email: "",
                    address: { street: "", suite: "", city: ""},
                    phone: "",
                    website: "",
                })
                setAdding(false);
            }

            return (
                <div>
                    <button onClick={() => setAdding(true)}>Thêm</button>
                    { adding && (
                        <div>
                            <div>
                                <h4> Thêm người dùng</h4>
                                <label htmlFor="name">Name:</label>
                                <input type="text" id="name" value={user.name} onChange={handleChange} /><br/>
                                <label htmlFor="username">Username:</label>
                                <input type="text" id="username" value={user.username} onChange={handleChange} /><br/>
                                <label htmlFor="email">Email:</label>
                                <input type="text" id="email" value={user.email} onChange={handleChange} /><br/>
                                <label htmlFor="street">Street:</label>
                                <input type="text" id="street" value={user.address.street} onChange={handleChange} /><br/>
                                <label htmlFor="suite">Suite:</label>
                                <input type="text" id="suite" value={user.address.suite} onChange={handleChange} /><br/>
                                <label htmlFor="city">City:</label>
                                <input type="text" id="city" value={user.address.city} onChange={handleChange} /><br/>
                                <label htmlFor="phone">Phone:</label>
                                <input type="text" id="phone" value={user.phone} onChange={handleChange} /><br/>
                                <label htmlFor="website">Website:</label>
                                <input type="text" id="website" value={user.website} onChange={handleChange} /><br/>
                                <button onClick={handleAdd}>Lưu</button>
                                <button onClick={() => setAdding(false)}>Hủy</button>
                            </div>
                        </div>
                    )}
                </div>
            )

        }

        function ResultTable({ keyword, user, onAdded }) {
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);

            React.useEffect(() => {
                fetch("https://jsonplaceholder.typicode.com/users")
                .then(res => res.json())
                .then(data => { setUsers(data); setLoading(false); });
            }, []);

            React.useEffect(() => {
                if (user) {
                    setUsers((prev) => [...prev, { ...user, id: prev.length + 1 }]);
                    onAdded();
                }
            }, [user]);

            const filteredUsers = users.filter(u =>
                u.name.toLowerCase().includes(keyword.toLowerCase()) ||
                u.username.toLowerCase().includes(keyword.toLowerCase())
            );

            return (
                <div>
                    {loading ? (
                        <p>Loading...</p>
                    ) : (
                        <table border="1" cellPadding="10" cellSpacing="0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Address City</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filteredUsers.map(u => (
                                    <tr key={u.id}>
                                        <td>{u.id}</td>
                                        <td>{u.name}</td>
                                        <td>{u.username}</td>
                                        <td>{u.email}</td>
                                        <td>{u.address.city}</td>
                                        <td>
                                            <button onClick={ () => editUser(u)}>Sửa</button>
                                            <button onClick={ () => removeUser(u.id)}>Xóa</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    )}
                </div>
            )
        }

        function App() {
            const [kw, setKeyWord] = useState("");
            const [newUser, setNewUser] = useState(null);

            return (
                <div>
                    <h1>Quản lý người dùng</h1>
                    <SearchForm onChangeValue={setKeyWord} />
                    <AddUser onAdd={setNewUser} />
                    <ResultTable keyword={kw} user={newUser} onAdded={() => setNewUser(null)} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    

</body>
</html>
